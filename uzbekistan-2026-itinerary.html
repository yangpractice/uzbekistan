<title>烏茲別克 2026｜行程手冊 · Uzbekistan 2026 Trip Book</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --paper:#F6F1E5; --paper-2:#EFE7D5; --card:#FFFDF8;
    --ink:#241F1A; --ink-soft:#6b6559; --line:#E2D8C3;
    --blue:#1B4B7A;   --blue-soft:#E7EEF5;
    --clay:#B65A28;   --clay-soft:#F7E9DE;
    --gold:#9C711B;   --gold-soft:#F4ECD8;
    --teal:#1B6B67;   --teal-soft:#E2F0EE;
    --slate:#5B564C;  --slate-soft:#EBE7DC;
    --star:#B8862E;
    --shadow: 0 1px 2px rgba(36,31,26,.06), 0 4px 14px rgba(36,31,26,.06);
    --radius: 10px;
    --topbar-h: 54px;
    --tabs-h: 46px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1C1915; --paper-2:#242019; --card:#262219;
      --ink:#F1EADC; --ink-soft:#B8AF9D; --line:#3A342A;
      --blue-soft:#1E2C3A; --clay-soft:#332217; --gold-soft:#332A16; --teal-soft:#17302C; --slate-soft:#2C291F;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1C1915; --paper-2:#242019; --card:#262219;
    --ink:#F1EADC; --ink-soft:#B8AF9D; --line:#3A342A;
    --blue-soft:#1E2C3A; --clay-soft:#332217; --gold-soft:#332A16; --teal-soft:#17302C; --slate-soft:#2C291F;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.55;
  }
  h1,h2,h3,.disp{font-family:'Noto Serif TC', 'Noto Sans TC', serif; font-weight:700; letter-spacing:.01em;}
  .wrap{max-width:560px; margin:0 auto; position:relative;}
  a{color:inherit;}
  button{font-family:inherit; cursor:pointer;}

  /* ---- topbar ---- */
  .topbar{
    position:sticky; top:0; z-index:30; height:var(--topbar-h);
    background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between;
    padding:0 14px;
  }
  .brand{display:flex; flex-direction:column; line-height:1.15;}
  .brand .t1{font-family:'Noto Serif TC',serif; font-weight:700; font-size:16px;}
  .brand .t2{font-size:11px; color:var(--ink-soft); margin-top:1px;}
  .langbtn{
    display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden;
    background:var(--card); flex-shrink:0;
  }
  .langbtn button{
    border:none; background:transparent; color:var(--ink-soft);
    font-size:12px; font-weight:600; padding:7px 12px;
  }
  .langbtn button.on{background:var(--blue); color:#fff;}

  /* ---- day tabs ---- */
  .daytabs{
    position:sticky; top:var(--topbar-h); z-index:29;
    background:var(--paper); border-bottom:1px solid var(--line);
    display:flex; gap:6px; overflow-x:auto; padding:7px 10px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .daytabs::-webkit-scrollbar{display:none;}
  .tab{
    flex-shrink:0; border:1px solid var(--line); background:var(--card);
    color:var(--ink-soft); border-radius:999px; padding:7px 13px;
    font-size:12.5px; font-weight:600; white-space:nowrap;
  }
  .tab .d1{font-weight:700; color:var(--ink);}
  .tab.active{background:var(--ink); border-color:var(--ink);}
  .tab.active, .tab.active .d1{color:var(--paper);}
  .tab.special{background:var(--clay-soft); border-color:var(--clay);}
  .tab.special.active{background:var(--clay); border-color:var(--clay); color:#fff;}
  .tab.special.active .d1{color:#fff;}

  main{padding-bottom:60px;}
  .panel{display:none;}
  .panel.active{display:block;}

  /* ---- day header ---- */
  .dayhead{padding:16px 16px 10px;}
  .dayhead .date{font-size:13px; color:var(--ink-soft); font-weight:600;}
  .dayhead h2{font-size:21px; margin:2px 0 0; }
  .dayhead .route{font-size:13px; color:var(--ink-soft); margin-top:2px;}

  /* ---- sticky map ---- */
  .mapbox{
    position:sticky; top:calc(var(--topbar-h) + var(--tabs-h)); z-index:20;
    background:var(--paper); padding:6px 16px 10px; border-bottom:1px solid var(--line);
  }
  .mapframe-wrap{
    border-radius:var(--radius); overflow:hidden; border:1px solid var(--line);
    box-shadow:var(--shadow); background:var(--card);
  }
  .mapframe-wrap iframe{display:block; width:100%; height:190px; border:0;}
  .mapcap{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:12px; color:var(--ink-soft); margin-top:6px; padding:0 2px;
  }
  .mapcap .loc{display:flex; align-items:center; gap:5px; min-width:0;}
  .mapcap .loc b{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .mapcap .reset{
    flex-shrink:0; border:none; background:none; color:var(--blue); font-size:12px;
    font-weight:600; text-decoration:underline; text-underline-offset:2px; padding:2px 0;
  }
  .icon{width:14px; height:14px; flex-shrink:0;}

  /* ---- cards ---- */
  .cards{padding:14px 16px 6px; display:flex; flex-direction:column; gap:14px;}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    box-shadow:var(--shadow); overflow:hidden; border-left-width:4px;
  }
  .card.cat-blue{border-left-color:var(--blue);}
  .card.cat-clay{border-left-color:var(--clay);}
  .card.cat-gold{border-left-color:var(--gold);}
  .card.cat-teal{border-left-color:var(--teal);}
  .card.cat-slate{border-left-color:var(--slate);}

  .card-media{width:100%; aspect-ratio:16/10; background:var(--paper-2); position:relative;}
  .card-media img{width:100%; height:100%; object-fit:cover; display:block;}
  .icon-tile{width:100%; height:100%; display:flex; align-items:center; justify-content:center;}
  .icon-tile svg{width:34px; height:34px;}
  .icon-tile.cat-blue{background:var(--blue-soft); color:var(--blue);}
  .icon-tile.cat-clay{background:var(--clay-soft); color:var(--clay);}
  .icon-tile.cat-gold{background:var(--gold-soft); color:var(--gold);}
  .icon-tile.cat-teal{background:var(--teal-soft); color:var(--teal);}
  .icon-tile.cat-slate{background:var(--slate-soft); color:var(--slate);}

  .card-body{padding:12px 14px 14px;}
  .card-meta{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:5px;}
  .badge{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
  }
  .badge.cat-blue{background:var(--blue-soft); color:var(--blue);}
  .badge.cat-clay{background:var(--clay-soft); color:var(--clay);}
  .badge.cat-gold{background:var(--gold-soft); color:var(--gold);}
  .badge.cat-teal{background:var(--teal-soft); color:var(--teal);}
  .badge.cat-slate{background:var(--slate-soft); color:var(--slate);}
  .card-time{font-size:12px; color:var(--ink-soft); font-weight:500;}
  .stars{font-size:12px; color:var(--star);}
  .card-title{font-size:17px; margin:0 0 6px; line-height:1.35;}
  .card-info{font-size:13.5px; color:var(--ink); margin:0 0 8px; opacity:.9;}
  .card-note{
    display:flex; gap:7px; font-size:12.5px; color:var(--clay);
    background:var(--clay-soft); border-radius:8px; padding:8px 10px; margin:0 0 10px;
    line-height:1.5;
  }
  .card-note svg{width:15px; height:15px; flex-shrink:0; margin-top:1.5px;}
  .card-actions{display:flex; flex-wrap:wrap; gap:8px;}
  .card-actions button, .card-actions a{
    display:inline-flex; align-items:center; gap:5px;
    font-size:12px; font-weight:600; border-radius:999px; padding:7px 11px;
    border:1px solid var(--line); background:var(--paper); color:var(--ink);
    text-decoration:none;
  }
  .card-actions .pinbtn{background:var(--ink); color:var(--paper); border-color:var(--ink);}
  .card-actions svg{width:13px; height:13px;}

  /* ---- before-departure panel ---- */
  .before-wrap{padding:16px;}
  .before-intro{font-size:13.5px; color:var(--ink-soft); margin-bottom:18px;}
  .section{margin-bottom:22px;}
  .section h3{font-size:16px; display:flex; align-items:center; gap:7px; margin:0 0 10px;}
  .section h3 svg{width:18px; height:18px; color:var(--clay);}
  .section.pack h3 svg{color:var(--teal);}
  .section.warn h3 svg{color:var(--blue);}
  .checklist{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px;}
  .checklist li{
    display:flex; align-items:flex-start; gap:10px; background:var(--card);
    border:1px solid var(--line); border-radius:9px; padding:10px 12px;
    font-size:13.5px;
  }
  .checklist input[type=checkbox]{
    width:18px; height:18px; margin:1px 0 0; flex-shrink:0; accent-color:var(--clay);
  }
  .section.pack .checklist input{accent-color:var(--teal);}
  .checklist li.checked{opacity:.5; text-decoration:line-through;}
  .remind{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px;}
  .remind li{
    background:var(--blue-soft); border-radius:9px; padding:10px 12px; font-size:13px;
    line-height:1.55; border-left:3px solid var(--blue);
  }
  .printnote{font-size:12px; color:var(--ink-soft); margin:-8px 0 12px;}

  footer{padding:18px 16px 40px; text-align:center; font-size:11.5px; color:var(--ink-soft);}
</style>
</head>

{ id:'d6', date:'2026-09-30', wd:{zh:'週三',en:'Wed'}, city:{zh:'布哈拉',en:'Bukhara'}, route:{zh:'布哈拉市區',en:'Bukhara city'}, mapQ:'Bukhara, Uzbekistan',

      info:{zh:'1807 年建造的四塔門樓型建築，名稱意為「四座塔」；四個圓塔頂端各有藍綠色穹頂，是布哈拉很有辨識度的地標。',en:'Built in 1807, a four-towered gatehouse whose name means "four minarets"; each turquoise dome differs slightly — a very recognizable Bukhara landmark.'},
      note:{zh:'與老城主要景點稍有距離，建議早上先去，再一路走回老城。',en:'A bit apart from the main old-city sights — good as a morning start before walking back into the center.'},
      mapsLink:'https://maps.google.com/?q=Chor+Minor+Bukhara', mapQuery:'Chor Minor, Bukhara', source:'https://uzbekistan.travel/en/o/chor-minor/', image:IMG.chorminor},
    {type:'sight', time:{zh:'2–3 小時',en:'2–3 hr'}, title:{zh:'古城區 / Historic Centre of Bukhara',en:'Historic Centre of Bukhara'},
      info:{zh:'布哈拉超過 2,000 年歷史，是保存度很高的中亞伊斯蘭歷史城市；老城的價值不只在單一建築，而在完整城市肌理與街巷。',en:'Over 2,000 years old and remarkably intact — Bukhara\'s value lies less in any single building than in its complete old-town fabric of lanes, bazaars and squares.'},
      note:{zh:'適合用步行方式慢慢逛，包含圓頂市集、巷弄、茶館與廣場。',en:'Best explored slowly on foot, taking in the domed bazaars, lanes, teahouses and squares.'},
      mapsLink:'https://maps.google.com/?q=Historic+Centre+of+Bukhara', mapQuery:'Historic Centre of Bukhara', source:'https://whc.unesco.org/en/list/602', image:IMG.oldcitybuk},
    {type:'sight', time:{zh:'約 45–60 分鐘',en:'~45–60 min'}, title:{zh:'Kalan Mosque / Poi-Kalyan',en:'Kalan Mosque / Poi-Kalyan'},
      info:{zh:'布哈拉代表性宗教建築群，與著名 Kalyan Minaret、Mir-i-Arab Madrasa 構成城市天際線；Kalyan Minaret 是中亞磚雕建築的重要代表。',en:'Bukhara\'s landmark religious ensemble, its skyline formed together with the Kalyan Minaret and Mir-i-Arab Madrasa — a key showcase of Central Asian brickwork.'},

    {type:'sight', time:{zh:'約 60 分鐘',en:'~60 min'}, title:{zh:'Ark of Bukhara',en:'Ark of Bukhara'},
      info:{zh:'布哈拉歷代統治者的巨大城堡/城堡式宮殿，現存主要建築多經後期重建；是理解布哈拉政治與城市核心的關鍵景點。',en:'The huge fortress-palace of Bukhara\'s historic rulers; most standing structures are later reconstructions, but it\'s key to understanding the city\'s political core.'},

const mapState = {}; // dayId -> current query string
DAYS.forEach(d=>mapState[d.id]=d.mapQ);

/* ============ HELPERS ============ */
function esc(s){ return (s+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function embedUrl(q){ return 'https://www.google.com/maps?q='+encodeURIComponent(q)+'&output=embed'; }
function fmtDate(d, l){
  const day = DAYS.find(x=>x.id===d);
  const parts = day.date.split('-');
  return l==='zh' ? (parts[1]+'/'+parts[2]) : (parts[1]+'/'+parts[2]);
}

/* ============ RENDER TABS ============ */
function renderTabs(){
  let h = '';
  DAYS.forEach(d=>{
    const p = d.date.split('-');
    h += '<button class="tab'+(currentTab===d.id?' active':'')+'" data-tab="'+d.id+'">'+
         '<span class="d1">'+p[1]+'/'+p[2]+'</span> '+ (lang==='zh'?d.wd.zh:d.wd.en) +
         '</button>';
  });
  h += '<button class="tab special'+(currentTab==='before'?' active':'')+'" data-tab="before">'+
       (lang==='zh'?'✈ 出發前必看':'✈ Before You Go') + '</button>';
  document.getElementById('daytabs').innerHTML = h;
}

/* ============ RENDER MEDIA ============ */
function mediaHTML(item){
  if(item.image){
    return '<div class="card-media"><img src="'+item.image+'" alt="'+esc(item.title[lang])+'" loading="lazy"></div>';
  }
  const t = TYPE[item.type];
  return '<div class="card-media"><div class="icon-tile cat-'+t.c+'">'+icon(t.icon)+'</div></div>';
}

/* ============ RENDER CARD ============ */
function cardHTML(item, dayId){
  const t = TYPE[item.type];
  const stars = item.star ? '<span class="stars">'+'⭐'.repeat(item.star)+'</span>' : '';
  const noteHTML = item.note ? '<div class="card-note">'+icon('warn')+'<span>'+esc(item.note[lang])+'</span></div>' : '';
  const pinBtn = '<button class="pinbtn" data-day="'+dayId+'" data-q="'+esc(item.mapQuery)+'">'+icon('pin')+(lang==='zh'?'在上方地圖查看':'View on map')+'</button>';
  const mapBtn = item.mapsLink ? '<a href="'+item.mapsLink+'" target="_blank" rel="noopener">'+icon('ext')+'Google Maps</a>' : '';
  const srcBtn = item.source ? '<a href="'+item.source+'" target="_blank" rel="noopener">'+icon('ext')+(lang==='zh'?'資料來源':'Source')+'</a>' : '';
  return '<article class="card cat-'+t.c+'">'+
    mediaHTML(item)+
    '<div class="card-body">'+
      '<div class="card-meta"><span class="badge cat-'+t.c+'">'+t[lang]+'</span><span class="card-time">'+esc(item.time[lang])+'</span>'+stars+'</div>'+
      '<h3 class="card-title">'+esc(item.title[lang])+'</h3>'+
      '<p class="card-info">'+esc(item.info[lang])+'</p>'+
      noteHTML+
      '<div class="card-actions">'+pinBtn+mapBtn+srcBtn+'</div>'+
    '</div>'+
  '</article>';
}

/* ============ RENDER DAY PANEL ============ */
function dayPanelHTML(d){
  const p = d.date.split('-');
  const dateLabel = p[0]+'-'+p[1]+'-'+p[2]+'（'+(lang==='zh'?d.wd.zh:d.wd.en)+'）';
  const cards = d.items.map(it=>cardHTML(it, d.id)).join('');
  const q = mapState[d.id];
  return '<section class="panel" data-panel="'+d.id+'">'+
    '<div class="dayhead">'+
      '<div class="date">'+dateLabel+'</div>'+
      '<h2>'+esc(lang==='zh'?d.city.zh:d.city.en)+'</h2>'+
      '<div class="route">'+esc(lang==='zh'?d.route.zh:d.route.en)+'</div>'+
    '</div>'+
    '<div class="mapbox">'+
      '<div class="mapframe-wrap"><iframe data-mapday="'+d.id+'" src="'+embedUrl(q)+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></div>'+
      '<div class="mapcap"><span class="loc">'+icon('pin')+'<b data-maplabel="'+d.id+'">'+esc(q)+'</b></span>'+
      '<button class="reset" data-reset="'+d.id+'" data-defaultq="'+esc(d.mapQ)+'">'+(lang==='zh'?'回到總覽':'Back to overview')+'</button></div>'+
    '</div>'+
    '<div class="cards">'+cards+'</div>'+
  '</section>';
}

/* ============ RENDER BEFORE PANEL ============ */
function checklistHTML(list, prefix){
  return '<ul class="checklist">'+list.map((it,i)=>{
    const id = prefix+i;
    return '<li data-cbwrap="'+id+'"><input type="checkbox" id="'+id+'" data-cb="'+id+'"><label for="'+id+'">'+esc(it[lang])+'</label></li>';
  }).join('')+'</ul>';
}
function beforePanelHTML(){
  return '<section class="panel" data-panel="before"><div class="before-wrap">'+
    '<h2>'+BEFORE.title[lang]+'</h2>'+
    '<p class="before-intro">'+BEFORE.intro[lang]+'</p>'+
    '<div class="section"><h3>'+icon('doc')+(lang==='zh'?'證件與需列印文件':'Documents to Bring & Print')+'</h3>'+
      '<p class="printnote">🖨 '+BEFORE.printnote[lang]+'</p>'+
      checklistHTML(BEFORE.docs,'doc')+
    '</div>'+
    '<div class="section pack"><h3>'+icon('pack')+(lang==='zh'?'服裝與隨身物品':'What to Pack')+'</h3>'+
      checklistHTML(BEFORE.pack,'pack')+
    '</div>'+
    '<div class="section warn"><h3>'+icon('alert')+(lang==='zh'?'行前重要提醒':'Key Reminders')+'</h3>'+
      '<ul class="remind">'+BEFORE.reminders.map(r=>'<li>'+esc(r[lang])+'</li>').join('')+'</ul>'+
    '</div>'+
  '</div></section>';
}

/* ============ MASTER RENDER ============ */
function renderAll(){
  document.getElementById('brandT1').textContent = lang==='zh' ? '🇺🇿 烏茲別克 2026' : '🇺🇿 Uzbekistan 2026';
  document.getElementById('brandT2').textContent = lang==='zh'
    ? '塔什干→撒馬爾罕→七湖→布哈拉→希瓦→Nukus→塔什干'
    : 'Tashkent → Samarkand → Seven Lakes → Bukhara → Khiva → Nukus → Tashkent';
  document.getElementById('footer').textContent = lang==='zh'
    ? '行前準備妥當，願旅途一切順利。'
    : 'Wishing you a smooth and beautiful trip.';
  document.getElementById('btnZh').classList.toggle('on', lang==='zh');
  document.getElementById('btnEn').classList.toggle('on', lang==='en');

  renderTabs();
  const html = DAYS.map(dayPanelHTML).join('') + beforePanelHTML();
  document.getElementById('main').innerHTML = html;
  restoreChecks();
  showPanel(currentTab);
}

function showPanel(id){
  currentTab = id;
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.dataset.panel===id));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===id));
}

/* ============ CHECKLIST PERSISTENCE ============ */
function restoreChecks(){
  try{
    const saved = JSON.parse(localStorage.getItem('uz2026-checks')||'{}');
    Object.keys(saved).forEach(id=>{
      const cb = document.querySelector('[data-cb="'+id+'"]');
      if(cb && saved[id]){ cb.checked = true; cb.closest('li').classList.add('checked'); }
    });
  }catch(e){}
}
function saveCheck(id, val){
  try{
    const saved = JSON.parse(localStorage.getItem('uz2026-checks')||'{}');
    saved[id]=val;
    localStorage.setItem('uz2026-checks', JSON.stringify(saved));
  }catch(e){}
}

/* ============ EVENTS ============ */
document.getElementById('btnZh').addEventListener('click', ()=>{ if(lang!=='zh'){lang='zh'; renderAll();} });
document.getElementById('btnEn').addEventListener('click', ()=>{ if(lang!=='en'){lang='en'; renderAll();} });

document.addEventListener('click', function(e){
  const tabBtn = e.target.closest('[data-tab]');
  if(tabBtn){ showPanel(tabBtn.dataset.tab); return; }

  const pin = e.target.closest('.pinbtn');
  if(pin){
    const day = pin.dataset.day, q = pin.dataset.q;
    mapState[day] = q;
    const frame = document.querySelector('[data-mapday="'+day+'"]');
    if(frame) frame.src = embedUrl(q);
    const label = document.querySelector('[data-maplabel="'+day+'"]');
    if(label) label.textContent = q;
    return;
  }

  const reset = e.target.closest('[data-reset]');
  if(reset){
    const day = reset.dataset.reset, q = reset.dataset.defaultq;
    mapState[day] = q;
    const frame = document.querySelector('[data-mapday="'+day+'"]');
    if(frame) frame.src = embedUrl(q);
    const label = document.querySelector('[data-maplabel="'+day+'"]');
    if(label) label.textContent = q;
    return;
  }

  const cbLabel = e.target.closest('label');
  if(cbLabel && cbLabel.closest('.checklist')){
    // let native checkbox toggle happen, handled by change listener below
  }
});

document.addEventListener('change', function(e){
  if(e.target.matches('[data-cb]')){
    const id = e.target.dataset.cb;
    e.target.closest('li').classList.toggle('checked', e.target.checked);
    saveCheck(id, e.target.checked);
  }
});

/* ============ INIT ============ */
renderAll();
</script>
</body>
</html>
